# Sadece GUVENLIK odakli Dependabot yapilandirmasi.
#
# open-pull-requests-limit: 0 -> "yeni surum cikti" PR'lari (version updates)
# tamamen kapanir. Guvenlik PR'lari bu limitten etkilenmez; hangi aciklar icin
# PR acilacagini repo ayarlarindaki Dependabot auto-triage kurallari belirler.
version: 2

updates:
  # Python paketleri: Airflow (/) ve FastAPI servisi (/api)
  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/api"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 0
    labels: ["security"]
    commit-message:
      prefix: "dependabot(pip)"
    groups:
      # Ayni klasordeki tum Python guvenlik duzeltmeleri tek PR'da ->
      # birbirine bagimli paketler (orn. requests + certifi) birlikte guncellenir.
      python-security:
        applies-to: security-updates
        patterns: ["*"]

  # Node.js paneli (/dashboard)
  - package-ecosystem: "npm"
    directory: "/dashboard"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 0
    labels: ["security"]
    commit-message:
      prefix: "dependabot(npm)"
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  # GitHub Actions workflow'larindaki action'lar
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 0
    labels: ["security"]
    commit-message:
      prefix: "dependabot(actions)"
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
