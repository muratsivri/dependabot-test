# Dependabot surum guncellemeleri yapilandirmasi.
# Belgeler: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2

updates:
  # 1) Python paketleri (requirements.txt)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 5
    labels: ["dependencies", "python"]
    commit-message:
      prefix: "deps(pip)"
    # Kucuk/yama guncellemelerini tek PR'da topla -> daha az gurultu
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]

  # 2) Dockerfile icindeki base image (apache/airflow)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "deps(docker)"
    ignore:
      # Airflow 3.x buyuk bir gecis; otomatik onerilmesin, elle planlayacagiz.
      - dependency-name: "apache/airflow"
        update-types: ["version-update:semver-major"]

  # 3) docker-compose.yaml icindeki image'lar (postgres vb.)
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "deps(compose)"

  # 4) GitHub Actions workflow'larindaki action surumleri
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "deps(actions)"
    groups:
      actions:
        patterns: ["*"]
