# Sadece GUVENLIK odakli Dependabot yapilandirmasi.
#
# open-pull-requests-limit: 0 -> "yeni surum cikti" PR'lari (version updates)
# tamamen kapanir. Guvenlik PR'lari (security updates) bu limitten etkilenmez;
# onlar repo ayarlarindaki "Dependabot security updates" ile acilir ve
# asagidaki etiket/commit/grup ayarlarini kullanir.
version: 2

updates:
  # Python paketleri (requirements.txt)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 0
    labels: ["security"]
    commit-message:
      prefix: "security(pip)"
    groups:
      # Tum Python guvenlik duzeltmeleri tek PR'da -> birbirine bagimli
      # paketler (orn. requests + certifi) ayni anda guncellenir.
      python-security:
        applies-to: security-updates
        patterns: ["*"]

  # GitHub Actions workflow'larindaki action'lar
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 0
    labels: ["security"]
    commit-message:
      prefix: "security(actions)"
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]